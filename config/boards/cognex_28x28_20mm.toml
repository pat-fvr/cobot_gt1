# Placa de calibración Cognex "28x28@20mm": tablero de ajedrez de 28 x 28 cuadros de 20 mm (27 x 27
# esquinas internas), con un fiducial en T al centro. Sin marcadores: se detecta por crecimiento de la
# grilla (gt1/calibration/boards/corner_grid.py), aunque se vea en parte.
kind = "chessboard"
squares_x = 28
squares_y = 28
square_mm = 20.0

# Medido en el banco (2026-11-04). Solo se usa para informar la altura de la mesa (table_z_mm).
thickness_mm = 10.0

# Con la Basler del banco (imagen oscura) los cuadros claros quedan en ~120-190 y los oscuros en ~20.
min_corner_contrast = 20.0
