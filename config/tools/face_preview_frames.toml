# face_preview con las imágenes guardadas de la C270, sin cámara.
# uv run python gt1_tools/face_preview.py --config config/tools/face_preview_frames.toml
[components]
camera = "folder_c270"
piece_detector = "piece_color_background"
face_classifier = "face_texture"

[settings]
zone = "full_view"
captures_dir = "captures"
video_fourcc = "MJPG"           # si la cámara es un video, el resultado se graba en runs/face_preview/
video_file_extension = "avi"    # MJPG + avi funciona en cualquier OpenCV; mp4v + mp4 pesa menos
