# tray_loading_test: cargar en las bandejas detectadas (mitad inferior de la imagen) las pechugas con la piel
# arriba (mitad superior), con los lóbulos hacia lobes_toward_deg de la estrategia de colocación.
[components]
camera = "basler_acA1600"
robot = "UR10e"
gripper = "soft_x_asimetrico"
tray = "bandeja_pet"
piece_detector = "piece_skin_outline"     # solo piel arriba, sin escena vacía
tray_detector = "tray_rim_and_floor"
pick_strategy = "pick_top_down"
place_strategy = "place_top_down"

[settings]
pick_zone = "pick"              # mitad superior de la imagen
tray_zone = "tray"              # mitad inferior
# De izquierda a derecha en la imagen de la acA1600 (su calibración del 2026-11-10): casi +Y de la base.
load_order_toward_deg = 110.5
verify_loads = false            # true: al terminar el ciclo vuelve fuera de la vista y verifica cada carga
max_lobes_error_deg = 30.0      # con verify_loads; la línea central se mide con ~10° de error; al revés 180°

[settings.clear_view]
pose = "home"                   # de robot_poses.toml, enseñada con gt1_tools/freedrive.py
safe_height_mm = 200.0          # la punta sube en vertical hasta aquí antes de ir fuera de la vista
rise_speed_mm_s = 400.0         # 2026-11-10: 50 -> 100 -> 200 -> 400
clear_speed_deg_s = 120.0       # hasta la pose fuera de la vista: el máximo de la base y el hombro del UR10e
capture_settle_s = 0.5          # desde que llega hasta capturar: vibración y la imagen en camino
