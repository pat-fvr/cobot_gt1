# Cómo está armado el banco de pruebas. Si se mueve la mesa, la cámara o una zona, se cambia solo este archivo.
# Coordenadas en mm en el sistema de la base del robot.

# Superficie donde están las pechugas: la plataforma azul, de la calibración cámara-robot del 2026-11-12 con
# la acA1600 (superficie de la placa Cognex en Z=-12,6 menos sus 10 mm de espesor). Antes era la mesa, en
# Z=-120 (calibración del 2026-11-10): la bandeja de demo_static_tray sigue abajo, en la mesa.
# Al recalibrar sobre otra superficie, poner aquí la mesa que informa calibrate: con la de la mesa y las
# piezas en la plataforma, la toma viajó bajo la superficie de la plataforma y chocó (2026-11-12).
table_z_mm = -22.6

# La pose del robot fuera de la vista de la cámara, desde la que se captura, es "home" en robot_poses.toml.

# Zonas: polígonos (X, Y) en orden.
# pick: la plataforma azul, en la acA1600 los píxeles x 15-1585, y 200-660 proyectados a table_z_mm con su
# calibración del 2026-11-12 (la plataforma está en y ~285-600; el margen deja entera una pechuga que en la
# imagen sobresale del borde). Deja fuera la cinta y la bandeja, abajo: demo_static_tray captura mientras la
# bandeja cargada todavía sale, y no debe ver tomable la pechuga que va en ella.
# tray: la mitad inferior de la imagen (píxeles x 15-1585, y 610-1185) proyectada a la mesa con la
# calibración del 2026-11-10, con las bandejas sobre la mesa (POR REHACER con la plataforma y la cinta).
# flip_landing sigue siendo el valor de partida del 171 (no hay estación de volteo en el banco).
[zones.pick]
polygon_mm = [[553.0, -38.0], [200.0, 868.0], [490.0, 937.0], [812.0, 96.0]]

[zones.tray]
polygon_mm = [[764.0, 40.0], [419.0, 966.0], [764.0, 1057.0], [1082.0, 187.0]]

[zones.flip_landing]
polygon_mm = [[540.0, 490.0], [760.0, 490.0], [760.0, 680.0], [540.0, 680.0]]

# Bandeja fija de pick_place_test, apoyada en la mesa dentro de zones.tray (tray_loading_test las detecta).
# Es la bandeja de la derecha de escena_bandejas_vacias.png según el detector de bandejas del 2026-11-05
# (una sola línea, con el centro corrido ~2 cm).
# POR CONFIRMAR con la punta del gripper en el centro de la bandeja ('t' en freedrive).
[tray_placement]
center_mm = [761.0, 497.0]
axis_angle_deg = 22.0
