# Basler Scout scA1390 (monocromática, 1392 x 1040, GigE) a través del SDK MVS.
kind = "mvs"
camera_id = "basler_scA1390"
ip = "150.0.24.20"

# Si no coinciden, al conectar el programa se detiene y muestra lo que informa la cámara.
expected_model = "scA1390-ABB"
expected_serial = "20924634"

# La primera imagen tras iniciar la adquisición tarda ~1,1 s con la Scout.
first_frame_timeout_ms = 5000
frame_timeout_ms = 1000
max_incomplete_frames = 10

# Nodos GenICam que se fijan al conectar. Exposición de 30 ms con la ganancia al mínimo (350, menos
# ruido): con la luz del banco (2026-11-04) la piel queda bajo ~230 y solo saturan los reflejos del film.
# En múltiplos de 10 ms para que la luz de 50 Hz no haga variar el brillo entre imágenes.
genicam_nodes = { ExposureTimeAbs = 30000.0, GainRaw = 350 }

# Cómo se pasa de píxeles a mm: camera_model (recomendado) u homography, calibrados con
# gt1_tools/calibrate.py; o nominal_scale (mm_per_px) para probar sin calibrar.
[calibration]
method = "camera_model"
