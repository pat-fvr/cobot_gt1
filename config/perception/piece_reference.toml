# Piezas por diferencia con la escena vacía (references/<camera_id>/empty_scene.png, se captura con
# gt1_tools/capture_empty_scene.py). No depende del color de la mesa ni de que la luz sea pareja.
# Ajustado en el banco (2026-11-04) con la Basler (30 ms) sobre la mesa con film: 4 pechugas con
# el hueso arriba y 4 con la piel arriba: contornos de 190-230 x 155-180 mm sin los reflejos del film.
# Si se toca el film, capturar de nuevo la escena vacía: lo que se movió se toma por pieza.
kind = "reference"
min_difference_pct = 20.0       # cambio de brillo mínimo respecto de la escena vacía para ser pieza
glint_min_level = 200           # reflejos del film (se mueven con cualquier roce): no cuentan como cambio
speck_kernel_px = 3             # destellos tenues sueltos, se borran antes de juntar la pieza
blur_kernel_px = 5
morphology_kernel_px = 25       # ~17 mm con la Basler: junta los trozos del lado del hueso
contour_height_mm = 30.0
min_area_mm2 = 10000.0          # la pieza más chica midió 22000 mm2; el film movido deja manchas de ~4000
max_single_piece_area_mm2 = 40000.0
