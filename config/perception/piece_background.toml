# Piezas sobre fondo de alto contraste: umbral + contornos. Áreas en mm² de la mesa (no dependen de la cámara).
kind = "background"
pieces_are = "brighter"         # la pechuga es más clara que el fondo (fondo oscuro)
threshold = { method = "otsu" } # u { method = "fixed", level = 120 }
blur_kernel_px = 5
morphology_kernel_px = 9

# El contorno visible de una pieza abovedada queda más alto que la mesa: se proyecta a esta altura.
contour_height_mm = 30.0

min_area_mm2 = 3000.0               # manchas más chicas se ignoran
max_single_piece_area_mm2 = 40000.0 # sobre esto, son varias piezas juntas
