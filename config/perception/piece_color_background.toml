# Piezas de otro color que el fondo (p. ej. fondo turquesa con la webcam): distancia de color a la
# mediana de la zona. Detecta igual la piel (clara) y las costillas (oscuras). Áreas en mm² de la mesa.
kind = "background"
pieces_are = "different"
threshold = { method = "otsu" } # u { method = "fixed", level = 40 } (distancia de color 0..255)
blur_kernel_px = 5
morphology_kernel_px = 9
contour_height_mm = 30.0
min_area_mm2 = 3000.0
max_single_piece_area_mm2 = 40000.0
